<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="icon" href="/static/logo.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fracs Parser — Настройки</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#000000; --bg2:#0a0a0a; --surface:#111111; --surface2:#161616; --surface3:#1f1f1f;
    --text:#ffffff; --muted:#888888; --muted2:#666666; --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.06);
    --primary:#F26522; --primary-dark:#e05a1a; --on-primary:#fff; --primary-soft:rgba(242,101,34,.14);
    --danger:#f87171; --ok:#34d399; --warn:#fbbf24;
    --radius:16px; --radius-sm:12px;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  *::-webkit-scrollbar{width:9px;height:9px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
  *::-webkit-scrollbar-thumb:hover{background:rgba(242,101,34,.65);border:2px solid transparent;background-clip:padding-box}
  *::-webkit-scrollbar-thumb:active{background:#F26522;border:2px solid transparent;background-clip:padding-box}
  *::-webkit-scrollbar-corner{background:transparent}
  *::-webkit-scrollbar-button{display:none;width:0;height:0}
  @supports not selector(::-webkit-scrollbar){
    *{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
  }
  html,body{min-height:100%;margin:0}
  body{background:
      radial-gradient(120% 80% at 70% 110%, rgba(242,101,34,.10), transparent 60%),
      radial-gradient(90% 70% at 20% 0%, rgba(242,101,34,.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;font-size:14px}
  h1,h2,h3{font-family:Jost,Montserrat,-apple-system,"Segoe UI",sans-serif}

  .apphead{display:flex;align-items:center;gap:14px;background:#0a0a0a;border-bottom:1px solid var(--line);
    padding:10px 18px;position:sticky;top:0;z-index:10}
  .apphead .brand2{display:flex;align-items:center;gap:10px;padding-right:16px;border-right:1px solid var(--line)}
  .apphead .brand2 .logo2{width:34px;height:34px;border-radius:10px;object-fit:cover;
    background:linear-gradient(135deg,var(--primary),#c44a16)}
  .apphead .brand2 .name{font-family:Jost,Montserrat,sans-serif;font-size:16px;font-weight:700;
    letter-spacing:-.01em;color:var(--text);white-space:nowrap}
  .apphead .spacer{flex:1}
  .btn-back{background:var(--surface2);color:var(--text);padding:10px 18px;font-size:13.5px;font-weight:650;
    border-radius:10px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
  .btn-back:hover{background:var(--surface3)}
  .btn-back svg{width:16px;height:16px}
  .langbtns{display:flex;gap:4px}
  .langbtns button{background:none;border:1px solid transparent;border-radius:6px;padding:3px;
    line-height:0;cursor:pointer;opacity:.5;filter:grayscale(.5);display:flex}
  .langbtns button.on{opacity:1;filter:none;border-color:var(--line);background:var(--surface)}
  .langbtns svg{display:block}

  .wrap{max-width:760px;margin:0 auto;padding:26px 18px 80px}
  .page-title{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
  .page-sub{color:var(--muted);font-size:13.5px;margin:0 0 22px;line-height:1.5}
  .saved-note{font-size:12px;color:var(--ok);margin:0 0 18px;display:none}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .card h2{margin:0;font-size:16px;font-weight:700;color:var(--text)}
  .card .sub{font-size:12.5px;color:var(--muted);margin-top:-6px}

  label.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
  label.field>span{font-weight:600}
  input[type=text],input[type=number],textarea,select{
    width:100%;font:inherit;font-weight:500;color:var(--text);
    background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(242,101,34,.14)}
  textarea{resize:vertical}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .hint{font-size:12px;color:var(--muted);line-height:1.5}
  label.check{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text);cursor:pointer}
  label.check input{accent-color:var(--primary);width:15px;height:15px}
  label.check.mini{font-size:12px}
  details.sect{border:1px solid var(--line);border-radius:14px;background:var(--surface2);overflow:hidden}
  details.sect>summary{cursor:pointer;padding:12px 14px;font-size:13px;font-weight:600;color:var(--text);
    list-style:none;user-select:none;display:flex;align-items:center;gap:9px}
  details.sect>summary::-webkit-details-marker{display:none}
  details.sect>summary::before{content:"›";font-size:18px;color:var(--muted);transition:transform .15s}
  details.sect[open]>summary::before{transform:rotate(90deg)}
  .sectbody{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px}

  button{font:inherit;font-weight:650;border:none;border-radius:999px;padding:11px 16px;cursor:pointer;
    transition:filter .12s,background .15s;color:var(--text);background:var(--surface3)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btn-gen{background:var(--surface3);color:var(--text)}
  .btn-gen:hover{filter:brightness(1.15)}
  .btn-clear{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
  .btn-clear:hover{background:rgba(248,113,113,.12);color:var(--danger);border-color:rgba(248,113,113,.3)}
  .btn-fracs{width:100%;text-align:left;padding:12px 16px;border-radius:14px;cursor:pointer;
    border:1px solid rgba(52,211,153,.35);
    background:linear-gradient(135deg,rgba(52,211,153,.16),rgba(52,211,153,.05));color:#34d399;
    font-weight:600;font-size:14px}
  .res{font-size:12.5px;line-height:1.5;min-height:16px}
  .ic-inline{display:inline-flex;vertical-align:-3px;width:14px;height:14px;margin-right:2px}
  .ic-inline svg{width:14px;height:14px;stroke-width:2}
  [hidden]{display:none!important}
  @media (max-width:560px){.apphead{padding:10px 12px}.wrap{padding:20px 14px 60px}}
</style>
</head>
<body>
<header class="apphead">
  <div class="brand2">
    <img class="logo2" src="/static/logo.png" alt="Fracs">
    <span class="name" data-i18n="brand">Fracs Parser</span>
  </div>
  <div class="langbtns" id="langbtns">
    <button data-lang="en" title="English"><svg width="24" height="16" viewBox="0 0 24 16"><rect width="24" height="16" rx="2" fill="#012169"/><path d="M0 0l24 16M24 0L0 16" stroke="#fff" stroke-width="3.2"/><path d="M0 0l24 16M24 0L0 16" stroke="#C8102E" stroke-width="1.6"/><path d="M12 0v16M0 8h24" stroke="#fff" stroke-width="4"/><path d="M12 0v16M0 8h24" stroke="#C8102E" stroke-width="2"/></svg></button>
    <button data-lang="ru" title="Русский"><svg width="24" height="16" viewBox="0 0 24 16"><rect width="24" height="16" rx="2" fill="#fff" stroke="#444" stroke-width=".7"/><rect x=".5" y="5.5" width="23" height="5.3" fill="#0039A6"/><rect x=".5" y="10.8" width="23" height="4.7" rx="2" fill="#D52B1E"/></svg></button>
  </div>
  <div class="spacer"></div>
  <a class="btn-back" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span data-i18n="back">Вернуться в чат</span></a>
</header>

<div class="wrap">
  <h1 class="page-title" data-i18n="title">Настройки AI-Агента</h1>
  <p class="page-sub" data-i18n="sub">Выберите нейросеть, вставьте ключ и задайте правила. Всё сохраняется автоматически — чат подхватит настройки сразу.</p>
  <p class="saved-note" id="savedNote" data-i18n="saved">Сохранено</p>

  <button type="button" id="aiFracsBtn" class="btn-fracs" style="display:none;margin-bottom:14px">
    ⚡ Fracs AI — встроенная нейросеть<span style="display:block;font-weight:400;font-size:11.5px;color:#9ba1a6;margin-top:2px" data-i18n="fracs_sub">Включена в Ultra · свой ключ не нужен</span>
  </button>

  <div class="card">
    <h2 data-i18n="h_provider">Модель и провайдер</h2>
    <div class="hint" id="aiProHint" style="display:none"></div>
    <label class="field"><span data-i18n="provider">Провайдер</span>
      <select id="aiProvider"><option>Загрузка…</option></select>
    </label>
    <label class="field" id="aiBaseUrlWrap" hidden><span>Base URL (…/v1)</span>
      <input type="text" id="aiBaseUrl" class="mono" placeholder="http://127.0.0.1:8000/v1">
    </label>
    <details class="sect" open id="aiModelSect"><summary data-i18n="model">Модель</summary><div class="sectbody">
      <label class="field"><span data-i18n="model_auto">Модель (подтягивается сама)</span>
        <span style="display:flex;gap:6px">
          <select id="aiModel" style="flex:1"></select>
          <button type="button" id="aiModelRefresh" class="btn-gen" style="flex:none;border-radius:10px;padding:0 12px" title="↻">↻</button>
        </span>
      </label>
      <label class="check mini"><input type="checkbox" id="aiModelManual"> <span data-i18n="manual">ввести модель вручную</span></label>
      <label class="field" id="aiModelManualWrap" hidden><input type="text" id="aiModelManualInput" class="mono" placeholder="glm-4.6"></label>
    </div></details>
  </div>

  <div class="card">
    <h2>API</h2>
    <label class="field"><span data-i18n="api_key">API ключ агента</span>
      <textarea id="aiKey" class="mono" placeholder="sk_..." style="min-height:84px"></textarea>
      <span class="hint" id="aiKeyHint">Вставьте API ключ выбранной нейросети</span>
    </label>
    <label class="field"><span data-i18n="key21st">Ключ 21st.dev (необязательно)</span>
      <input type="text" id="aiKey21st" class="mono" placeholder="21st_sk_...">
      <span style="display:flex;gap:8px;align-items:center;margin-top:4px">
        <button type="button" class="btn-clear" id="aiTest21stBtn" data-i18n="check">Проверить</button>
        <span class="res" id="aiTest21stRes" style="font-size:11px;color:var(--muted)" data-i18n="key21st_hint">Бесплатный поиск референсов-компонентов перед генерацией</span>
      </span>
    </label>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button type="button" class="btn-gen" id="aiTestBtn" data-i18n="test_conn">Проверить подключение</button>
      <span class="res" id="aiTestRes"></span>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="h_gen">Генерация</h2>
    <label class="check"><input type="checkbox" id="aiGenSite" checked> <span data-i18n="gen_site">Создавать сайты по карточкам бизнеса</span></label>
    <label class="check"><input type="checkbox" id="aiGenQr" checked> <span data-i18n="gen_qr">Выдавать QR-код на макет</span></label>
    <label class="field"><span data-i18n="style">Стиль макета</span>
      <select id="aiStyle">
        <option value="" selected>Авто — по рубрике бизнеса</option>
        <option value="auto">«Цех» — авто, тёмный индустриальный</option>
        <option value="coffee">«Обжарка» — кафе, тёплый editorial</option>
        <option value="medical">«Доверие» — медицина, светлый</option>
        <option value="beauty">«Латунь» — барбершоп, тёмный люкс</option>
        <option value="build">«Бетон» — стройка/мебель, модульная сетка</option>
        <option value="neutral">«Люкс» — нейтральный премиум</option>
      </select>
    </label>
    <label class="field"><span>ExtraПромт</span>
      <textarea id="aiExtra" placeholder="Дополнительные указания агенту…" style="min-height:84px"></textarea>
    </label>
    <details class="sect"><summary data-i18n="h_adv">Расширенные настройки</summary><div class="sectbody">
      <label class="field"><span data-i18n="temp">Температура</span><input type="number" id="aiTemp" min="0" max="2" step="0.1" value="0.7"></label>
      <label class="field"><span data-i18n="maxtok">Макс. токенов</span><input type="number" id="aiMaxTok" min="256" step="256" value="4096"></label>
    </div></details>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function ls(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
  function lset(k,v){try{localStorage.setItem(k,v);}catch(e){}}

  /* ── i18n ── */
  var T={
    en:{
      brand:'Fracs Parser', back:'Back to chat', title:'AI Agent Settings',
      sub:'Pick the neural network, paste the key and set the rules. Everything is saved automatically — the chat picks it up instantly.',
      saved:'Saved', fracs_sub:'Included in Ultra · no key needed',
      h_provider:'Model and provider', provider:'Provider', model:'Model', model_auto:'Model (fetched automatically)',
      manual:'enter model manually', api_key:'Agent API key',
      key21st:'21st.dev key (optional)', check:'Check', key21st_hint:'Free reference-component search before generation',
      test_conn:'Test connection', h_gen:'Generation',
      gen_site:'Build websites from business cards', gen_qr:'Attach a QR code to the layout',
      style:'Layout style', h_adv:'Advanced settings', temp:'Temperature', maxtok:'Max tokens',
      key_needed:'Paste the API key of the selected network', key_not_needed:'Fracs AI works on a Fracs subscription — no key needed',
      key_hint_prefix:'Paste the API key ', fracs_active:'Fracs AI is active — no key needed, models are managed by Fracs.',
      fracs_down:'Fracs AI is temporarily unavailable. Try again later.',
      style_auto:'Auto — by business category'
    },
    ru:{
      brand:'Fracs Parser', back:'Вернуться в чат', title:'Настройки AI-Агента',
      sub:'Выберите нейросеть, вставьте ключ и задайте правила. Всё сохраняется автоматически — чат подхватит настройки сразу.',
      saved:'Сохранено', fracs_sub:'Включена в Ultra · свой ключ не нужен',
      h_provider:'Модель и провайдер', provider:'Провайдер', model:'Модель', model_auto:'Модель (подтягивается сама)',
      manual:'ввести модель вручную', api_key:'API ключ агента',
      key21st:'Ключ 21st.dev (необязательно)', check:'Проверить', key21st_hint:'Бесплатный поиск референсов-компонентов перед генерацией',
      test_conn:'Проверить подключение', h_gen:'Генерация',
      gen_site:'Создавать сайты по карточкам бизнеса', gen_qr:'Выдавать QR-код на макет',
      style:'Стиль макета', h_adv:'Расширенные настройки', temp:'Температура', maxtok:'Макс. токенов',
      key_needed:'Вставьте API ключ выбранной нейросети', key_not_needed:'Fracs AI работает на подписке Fracs — ключ вводить не нужно',
      key_hint_prefix:'Вставьте API ключ ', fracs_active:'Fracs AI активен — ключ вводить не нужно, моделями управляет Fracs.',
      fracs_down:'Fracs AI временно недоступен. Попробуйте позже.',
      style_auto:'Авто — по рубрике бизнеса'
    }
  };
  var LANG=(ls('lang')==='ru')?'ru':'en';
  function applyLang(){
    LANG=(LANG==='ru')?'ru':'en'; var d=T[LANG];
    [].forEach.call(document.querySelectorAll('[data-i18n]'),function(el){var k=el.getAttribute('data-i18n'); if(d[k]!=null)el.innerHTML=d[k];});
    document.documentElement.lang=LANG;
    [].forEach.call($('langbtns').querySelectorAll('button'),function(b){b.classList.toggle('on',b.getAttribute('data-lang')===LANG);});
    var st=$('aiStyle');
    if(st&&st.options.length){st.options[0].textContent=d.style_auto;}
    lset('lang',LANG);
  }
  $('langbtns').addEventListener('click',function(e){var b=e.target.closest('button'); if(b){LANG=b.getAttribute('data-lang');applyLang();}});

  /* ── мигание «Сохранено» ── */
  var savedT=null;
  function savedNote(){
    var n=$('savedNote'); if(!n)return;
    n.style.display='block';
    clearTimeout(savedT); savedT=setTimeout(function(){n.style.display='none';},1400);
  }

  /* ── провайдеры и модели ── */
  var providers=[],currentProvider='';
  function providerInfo(id){for(var i=0;i<providers.length;i++){if(providers[i].id===id)return providers[i];}return null;}
  function activeKey(){
    if(currentProvider==='Fracs AI')return '';
    return ($('aiKey')&&$('aiKey').value.trim())||'';
  }
  function currentModel(){
    var man=$('aiModelManual');
    var model=(man&&man.checked&&$('aiModelManualInput')&&$('aiModelManualInput').value.trim())||($('aiModel')&&$('aiModel').value)||'';
    var info=providerInfo(currentProvider)||{};
    if(!model&&info.models&&info.models.length)model=info.models[0];
    return model;
  }

  function loadProviders(){
    var sel=$('aiProvider'); if(!sel)return;
    fetch('/api/ai/providers').then(function(r){return r.json()}).then(function(d){
      providers=(d&&d.providers)||[];
      var usable=providers.filter(function(p){return p.allowed!==false;});
      sel.innerHTML=usable.map(function(p){
        var badge=p.pro_only?' · Ultra':'';
        return '<option value="'+esc(p.id)+'">'+esc(p.id)+esc(badge)+'</option>';
      }).join('');
      if(!sel.options.length){sel.innerHTML='<option>—</option>';}
      var saved=ls('fracsAiProvider');
      var preferred=usable.some(function(p){return p.id===saved;})?saved:(usable[0]?usable[0].id:'Z.ai');
      if(usable.some(function(p){return p.id===preferred;}))sel.value=preferred;
      onProviderChange();
    }).catch(function(){
      sel.innerHTML='<option>Z.ai</option><option>OpenAI</option><option>Anthropic</option>';
      var saved=ls('fracsAiProvider');
      if([].some.call(sel.options,function(o){return o.value===saved;}))sel.value=saved;
      onProviderChange();
    });
  }

  function onProviderChange(){
    var sel=$('aiProvider');if(!sel)return;
    currentProvider=sel.value||'Z.ai';
    lset('fracsAiProvider',currentProvider);
    var info=providerInfo(currentProvider)||{};
    var hint=$('aiProHint');
    if(hint){
      if(info.pro_only&&info.allowed){hint.style.display='';
        hint.style.color=info.configured===false?'#F26522':'#34d399';
        hint.textContent=info.configured===false?T[LANG].fracs_down:T[LANG].fracs_active;}
      else{hint.style.display='none';hint.textContent='';}
    }
    var keyWrap=$('aiKey'),keyHint=$('aiKeyHint');
    if(keyWrap){
      var needKey=!info.pro_only&&info.needs_key!==false;
      keyWrap.disabled=!needKey;
      keyWrap.placeholder=needKey?'sk_...':'';
      if(keyHint)keyHint.textContent=needKey?(T[LANG].key_hint_prefix+currentProvider):T[LANG].key_not_needed;
      if(needKey&&!keyWrap.value.trim()){var sk=ls('fracsAiKey:'+currentProvider);if(sk)keyWrap.value=sk;}
    }
    var bu=$('aiBaseUrlWrap');if(bu)bu.hidden=currentProvider!=='Custom';
    var msect=$('aiModelSect');if(msect)msect.hidden=!!info.pro_only;
    if(info.pro_only){
      var man=$('aiModelManual');if(man)man.checked=false;
      var mw=$('aiModelManualWrap');if(mw)mw.hidden=true;
    }
    loadModels(false);
    savedNote();
  }

  function loadModels(showNote){
    var sel=$('aiModel');if(!sel)return;
    var info=providerInfo(currentProvider)||{};
    if(info.pro_only){
      var fm=(info.models&&info.models.length)?info.models:['openai/gpt-4o-mini'];
      sel.innerHTML=fm.map(function(m){return '<option value="'+esc(m)+'">'+esc(m)+'</option>';}).join('');
      var sf=ls('fracsAiModel:'+currentProvider);
      if(sf&&fm.indexOf(sf)>=0)sel.value=sf;
      return;
    }
    sel.innerHTML='<option>Загрузка моделей…</option>';
    var qs='?provider='+encodeURIComponent(currentProvider);
    var key=activeKey();
    if(currentProvider==='Custom'&&$('aiBaseUrl'))qs+='&base_url='+encodeURIComponent($('aiBaseUrl').value.trim());
    var mh={'Content-Type':'application/json'};
    if(key)mh['X-Api-Key']=key;
    fetch('/api/ai/models'+qs,{headers:mh}).then(function(r){return r.json()}).then(function(d){
      var models=(d&&d.models)||[];
      if(!models.length){models=(info.models&&info.models.length)?info.models:['glm-4.6'];}
      sel.innerHTML=models.map(function(m){return '<option value="'+esc(m)+'">'+esc(m)+'</option>';}).join('');
      var saved=ls('fracsAiModel:'+currentProvider);
      if(saved&&models.indexOf(saved)>=0)sel.value=saved;
      if($('aiModelManual')&&$('aiModelManual').checked){
        var mi=$('aiModelManualInput');
        if(mi&&mi.value){sel.innerHTML+='<option value="'+esc(mi.value)+'" selected>'+esc(mi.value)+' ('+(LANG==='ru'?'вручную':'manual')+')</option>';sel.value=mi.value;}
      }
    }).catch(function(){
      var fb=(info.models&&info.models.length)?info.models:['glm-4.6'];
      sel.innerHTML=fb.map(function(m){return '<option value="'+esc(m)+'">'+esc(m)+'</option>';}).join('');
    });
  }

  function bindModelControls(){
    var sel=$('aiProvider');
    if(sel)sel.addEventListener('change',onProviderChange);
    var ms=$('aiModel');
    if(ms)ms.addEventListener('change',function(){lset('fracsAiModel:'+currentProvider,ms.value);savedNote();});
    var ref=$('aiModelRefresh');
    if(ref)ref.addEventListener('click',function(){loadModels(false);});
    var man=$('aiModelManual'),mw=$('aiModelManualWrap');
    if(man)man.addEventListener('change',function(){
      if(mw)mw.hidden=!man.checked;
      if(man.checked){loadModels(false);var mi=$('aiModelManualInput');if(mi&&mi.value){var s=$('aiModel');if(s){s.innerHTML+='<option value="'+esc(mi.value)+'" selected>'+esc(mi.value)+'</option>';s.value=mi.value;}}}
      savedNote();
    });
    var mi=$('aiModelManualInput');
    if(mi)mi.addEventListener('input',function(){savedNote();});
    var bu=$('aiBaseUrl');
    if(bu)bu.addEventListener('change',function(){lset('fracsAiBaseUrl',bu.value.trim());if(currentProvider==='Custom')loadModels(false);savedNote();});
    var key=$('aiKey');
    if(key){var t=null;key.addEventListener('input',function(){clearTimeout(t);t=setTimeout(function(){
      if(currentProvider!=='Fracs AI')lset('fracsAiKey:'+currentProvider,key.value.trim());
      loadModels(false);savedNote();
    },900);});}
  }

  /* ── тесты ── */
  function bindTests(){
    var btn=$('aiTestBtn');
    if(btn)btn.addEventListener('click',function(){
      var r=$('aiTestRes');r.textContent='…';r.style.color='';
      var info=providerInfo(currentProvider)||{};
      var key=activeKey();
      if(info.pro_only&&!info.allowed){r.textContent='Fracs AI: Ultra only.';r.style.color='#f87171';return;}
      if(!info.pro_only&&info.needs_key!==false&&!key){r.textContent=LANG==='ru'?'Сначала вставьте API-ключ.':'Paste the API key first.';r.style.color='#f87171';return;}
      fetch('/api/ai/test',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({api_key:key,model:currentModel(),provider:currentProvider,base_url:($('aiBaseUrl')&&$('aiBaseUrl').value.trim())||''})})
        .then(function(x){return x.json()}).then(function(d){
          r.textContent=d.ok?('OK · '+(d.ms||'?')+' ms'):(d.error||'Error');
          r.style.color=d.ok?'#34d399':'#f87171';
        }).catch(function(){r.textContent='No connection.';r.style.color='#f87171';});
    });
    var b21=$('aiTest21stBtn');
    if(b21)b21.addEventListener('click',function(){
      var r=$('aiTest21stRes');
      var k=$('aiKey21st')&&$('aiKey21st').value.trim()||'';
      if(!k){r.textContent=LANG==='ru'?'Сначала вставьте ключ 21st.dev.':'Paste the 21st.dev key first.';r.style.color='#f87171';return;}
      r.textContent='…';r.style.color='';
      fetch('/api/ai/test21st',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key21st:k})})
        .then(function(x){return x.json()}).then(function(d){
          r.textContent=d.ok?'OK':((d.error==='no_key'?'':'— '+(d.error||'error')));
          r.style.color=d.ok?'#34d399':'#f87171';
        }).catch(function(){r.textContent='No connection.';r.style.color='#f87171';});
    });
  }

  /* ── прочие поля: восстановление и автосохранение ── */
  function bindPersist(){
    var map=[
      ['aiExtra','fracsAiExtra','input'],
      ['aiKey21st','fracsAiKey21st','input'],
      ['aiTemp','fracsAiTemp','input'],
      ['aiMaxTok','fracsAiMaxTok','input'],
      ['aiStyle','fracsAiStyle','change']
    ];
    map.forEach(function(m){
      var el=$(m[0]); if(!el)return;
      var saved=ls(m[1]); if(saved)el.value=saved;
      el.addEventListener(m[2],function(){lset(m[1],el.value);savedNote();});
    });
    [['aiGenSite','fracsAiGenSite'],['aiGenQr','fracsAiGenQr']].forEach(function(m){
      var el=$(m[0]); if(!el)return;
      var saved=ls(m[1]); if(saved!=='')el.checked=saved==='1';
      el.addEventListener('change',function(){lset(m[1],el.checked?'1':'0');savedNote();});
    });
  }

  /* ── баннер Fracs AI (виден, если тариф разрешает) ── */
  function bindFracsBanner(){
    fetch('/api/license').then(function(r){return r.json()}).then(function(st){
      var features=(st&&st.features)||[];
      var has=function(c){return features.indexOf(c)>=0;};
      var fb=$('aiFracsBtn');
      if(fb&&st.ok&&(has('fracs_ai')||has('ai')||has('business'))){
        fb.style.display='';
        fb.onclick=function(){
          var sel=$('aiProvider');
          if(sel&&[].some.call(sel.options,function(o){return o.value==='Fracs AI';})){
            sel.value='Fracs AI';onProviderChange();
          }
        };
      }
    }).catch(function(){});
  }

  function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  applyLang();
  bindModelControls();
  bindTests();
  bindPersist();
  bindFracsBanner();
  loadProviders();
})();
</script>
</body>
</html>
